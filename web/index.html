<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ElderBrain</title>
  <!-- 版式来自 GrowWithMehran/DeepSeek-Chat-Clone，MIT。见同目录 LICENSE。 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sidebar">
    <div class="logo-container">
      <div class="logo">
        <i class="fas fa-book-open"></i>
        <span>ElderBrain</span>
      </div>
    </div>
    <button class="new-chat-btn" type="button">
      <i class="fas fa-plus"></i>
      <span>新对话</span>
    </button>
    <div class="chat-history"></div>
    <div class="sidebar-footer">
      <div class="user-profile">
        <div class="user-avatar">本</div>
        <div class="user-name">本机</div>
      </div>
    </div>
  </div>

  <div class="chat-container">
    <div class="chat-header">
      <div class="chat-title">新对话</div>
      <div class="chat-actions">
        <button class="action-btn" id="clearChat" type="button" title="清空这场对话">
          <i class="fas fa-trash-alt"></i>
        </button>
      </div>
    </div>
    <div class="messages-container" id="messagesContainer">
      <div class="message" id="greetingMessage">
        <div class="avatar ai-avatar">
          <i class="fas fa-book-open"></i>
        </div>
        <div class="message-content">
          <div class="message-header">
            <div class="sender-name">ElderBrain</div>
          </div>
          <div class="message-text ai-message">问一条中文 SRD 5.1 的规则。译文是机器翻译、非官方。</div>
        </div>
      </div>
      <div class="typing-indicator" id="typingIndicator" style="display: none;">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      </div>
    </div>
    <div class="input-container">
      <div class="input-box">
        <textarea class="message-input" id="messageInput" placeholder="问一条中文规则" rows="1"></textarea>
        <button class="send-btn" id="sendButton" type="button" disabled>
          <i class="fas fa-arrow-up"></i>
        </button>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
